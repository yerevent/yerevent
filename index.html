<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yer.events</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #f1eee7;
  --surface: #e8e4dc;
  --surface2: #dedad1;
  --border: rgba(100,9,12,0.1);
  --text: #2a1a1b;
  --text-soft: #64090c;
  --text-muted: #a07070;
  --accent: #64090c;
  --radius: 14px;
  --festival:    #c0392b; --festival-bg:    rgba(192,57,43,0.12);
  --concert:     #7c5cbf; --concert-bg:     rgba(124,92,191,0.12);
  --educational: #1a7a4a; --educational-bg: rgba(26,122,74,0.12);
  --nightlife:   #b5006e; --nightlife-bg:   rgba(181,0,110,0.12);
  --sports:      #0070a8; --sports-bg:      rgba(0,112,168,0.12);
  --art:         #9a6800; --art-bg:         rgba(154,104,0,0.12);
  --expo:        #6b3fa0; --expo-bg:        rgba(107,63,160,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HERO ── */
.hero {
  padding: 56px 24px 44px;
  text-align: center;
  background: var(--bg);
}
.hero-logo {
  width: 100%;
  max-width: 700px;
  height: auto;
  display: block;
  margin: 0 auto 16px;
  border: none;
  background: none;
}
.hero p {
  font-family: 'Futura', 'Century Gothic', 'Trebuchet MS', sans-serif;
  color: #64090c;
  font-size: 0.95rem;
  font-weight: 400;
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.6;
  letter-spacing: 0.3px;
}

/* ── WRAPPER ── */
.wrapper { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }

/* ── FILTERS ── */
.filters-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 24px;
}
.filters-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.filter-group { flex: 1; min-width: 200px; }
.filter-group-label {
  font-size: 0.68rem; font-weight: 600;
  color: var(--text-muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: 1.2px;
}
.filter-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  font-size: 0.73rem; font-weight: 500;
  padding: 5px 12px; border-radius: 100px;
  border: 1px solid var(--border); cursor: pointer;
  background: transparent; color: var(--text-soft);
  font-family: 'Outfit', sans-serif; transition: all 0.15s; white-space: nowrap;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { color: #fff !important; border-color: transparent; }
.pill[data-type="festival"].active    { background: var(--festival); }
.pill[data-type="concert"].active     { background: var(--concert); }
.pill[data-type="educational"].active { background: var(--educational); }
.pill[data-type="nightlife"].active   { background: var(--nightlife); }
.pill[data-type="sports"].active      { background: var(--sports); }
.pill[data-type="art"].active         { background: var(--art); }
.pill[data-type="expo"].active        { background: var(--expo); }
.pill[data-city="Yerevan"].active     { background: #c0392b; }
.pill[data-city="Gyumri"].active      { background: #7c5cbf; }
.pill[data-city="Vanadzor"].active    { background: #1a7a4a; }
.pill[data-city="Meghri"].active      { background: #9a6800; }
.pill[data-city="Kapan"].active       { background: #b5006e; }
.pill[data-city="Near Yerevan"].active{ background: #0070a8; }
.pill[data-city="Other"].active       { background: #888; }
.pill.all-pill.active { background: var(--accent); }
.filter-clear {
  font-size: 0.72rem; color: var(--text-muted); background: none;
  border: none; cursor: pointer; font-family: 'Outfit', sans-serif;
  padding: 0; margin-top: 12px; text-decoration: underline; display: block;
}
.filter-clear:hover { color: var(--accent); }

/* ── VIEW BAR ── */
.view-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.view-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 4px; }
.view-tab { font-family: 'Outfit', sans-serif; font-size: 0.82rem; font-weight: 600; padding: 7px 18px; border-radius: 100px; border: none; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s; }
.view-tab.active { background: var(--accent); color: #fff; }
#resultCount { font-size: 0.78rem; color: var(--text-muted); }

/* ── CALENDAR ── */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-nav-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-soft); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.cal-month-label { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; text-align: center; }
.cal-weekday { font-size: 0.62rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); padding: 8px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-cell { min-height: 96px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 6px 6px; overflow: hidden; transition: border-color 0.15s; }
.cal-cell:hover { border-color: rgba(100,9,12,0.25); }
.cal-cell.other-month { opacity: 0.3; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell.today .day-num { color: var(--accent); font-weight: 700; }
.day-num { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px; }
.cal-event-chip { display: block; font-size: 0.62rem; font-weight: 500; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s; }
.cal-event-chip:hover { opacity: 0.75; }
.cal-more { font-size: 0.6rem; color: var(--text-muted); margin-top: 2px; }

/* ── LIST ── */
.list-month-group { margin-bottom: 32px; }
.list-month-heading { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--text-soft); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.event-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 8px; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: start; cursor: pointer; transition: border-color 0.2s, transform 0.15s; animation: fadeIn 0.3s ease both; }
.event-card:hover { border-color: rgba(100,9,12,0.3); transform: translateX(3px); }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.event-date-block { min-width: 50px; text-align: center; background: var(--bg); border-radius: 10px; padding: 8px 6px; }
.event-date-day { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--accent); }
.event-date-month { font-size: 0.62rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
.event-info { min-width: 0; }
.event-name { font-size: 0.97rem; font-weight: 600; margin-bottom: 5px; line-height: 1.3; color: var(--text); }
.event-meta { font-size: 0.77rem; color: var(--text-soft); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
.event-meta span { display: flex; align-items: center; gap: 4px; }
.event-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 0.67rem; font-weight: 600; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 100px; }
.event-action { display: flex; align-items: flex-start; padding-top: 2px; }
.gcal-btn { font-family: 'Outfit', sans-serif; font-size: 0.72rem; font-weight: 600; padding: 6px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--text-soft); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.gcal-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── STATES ── */
.state-box { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.state-box .icon { font-size: 2.5rem; margin-bottom: 14px; display: block; }
.state-box h3 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--text-soft); margin-bottom: 8px; }
.state-box p { font-size: 0.88rem; }

/* ── SYNC STATUS BAR ── */
.sync-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; padding: 7px 14px;
  margin-bottom: 16px; font-size: 0.75rem; color: var(--text-muted);
  flex-wrap: wrap; gap: 8px;
}
.sync-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--text-muted);
  margin-right: 6px; vertical-align: middle;
  transition: background 0.3s;
}
.sync-dot.live { background: #1a7a4a; box-shadow: 0 0 0 3px rgba(26,122,74,0.2); animation: pulse 2s infinite; }
.sync-dot.error { background: #c0392b; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 3px rgba(26,122,74,0.2);} 50%{box-shadow:0 0 0 6px rgba(26,122,74,0.05);} }
.sync-left { display: flex; align-items: center; gap: 4px; }
.sync-right { display: flex; align-items: center; gap: 10px; }
.sync-refresh-btn {
  font-family: 'Outfit', sans-serif; font-size: 0.72rem; font-weight: 600;
  padding: 4px 12px; border-radius: 100px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-soft); cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.sync-refresh-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.sync-refresh-btn:disabled { opacity: 0.5; cursor: default; }
.sync-countdown { font-size: 0.7rem; color: var(--text-muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MODAL ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(30,10,10,0.45); backdrop-filter: blur(5px); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
.overlay.open { display: flex; }
.modal { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.25s cubic-bezier(0.34,1.2,0.64,1); }
@keyframes modalIn { from { transform:scale(0.94) translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
.modal-header { padding: 20px 22px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--accent); }
.modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; transition: color 0.15s; }
.modal-close:hover { color: var(--accent); }
.modal-body { padding: 20px 22px; }
.detail-event-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1.2; margin-bottom: 12px; color: var(--text); }
.detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.detail-meta { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
.detail-meta-row { display: flex; align-items: flex-start; gap: 9px; font-size: 0.87rem; color: var(--text-soft); }
.detail-meta-icon { font-size: 0.95rem; flex-shrink: 0; margin-top: 1px; }
.detail-desc { background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 0.87rem; color: var(--text-soft); line-height: 1.65; margin-bottom: 18px; }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-gcal-big { flex: 1; background: var(--accent); color: #fff; font-family: 'Outfit', sans-serif; font-size: 0.87rem; font-weight: 600; padding: 11px 18px; border-radius: 100px; border: none; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
.btn-gcal-big:hover { background: #8a0b0f; transform: translateY(-1px); }
.btn-more { background: var(--surface) !important; color: var(--text-soft) !important; border: 1px solid var(--border) !important; }
.btn-more:hover { border-color: var(--accent) !important; color: var(--accent) !important; background: var(--surface) !important; transform: none !important; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .cal-cell { min-height: 62px; padding: 4px 3px 3px; }
  .cal-event-chip { font-size: 0.55rem; }
  .event-card { grid-template-columns: auto 1fr; }
  .event-action { display: none; }
  .filters-row { flex-direction: column; gap: 14px; }
}
</style>
</head>
<body>

<div class="hero">
  <img src="Untitled_design__4_.png" alt="yer.event" class="hero-logo">
  <p>Discover concerts, festivals, art shows and more across Armenia — all in one place.</p>
</div>

<div class="wrapper">

  <div class="filters-section">
    <div class="filters-row">
      <div class="filter-group">
        <div class="filter-group-label">Type</div>
        <div class="filter-pills">
          <button class="pill all-pill active" data-group="type" data-value="all">All</button>
          <button class="pill" data-group="type" data-type="festival"    data-value="festival">🎪 Festival</button>
          <button class="pill" data-group="type" data-type="concert"     data-value="concert">🎵 Concert</button>
          <button class="pill" data-group="type" data-type="educational" data-value="educational">📚 Educational</button>
          <button class="pill" data-group="type" data-type="nightlife"   data-value="nightlife">🌙 Nightlife</button>
          <button class="pill" data-group="type" data-type="sports"      data-value="sports">⚽ Sports</button>
          <button class="pill" data-group="type" data-type="art"         data-value="art">🎨 Art</button>
          <button class="pill" data-group="type" data-type="expo"        data-value="expo">🏛 Expo</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">City</div>
        <div class="filter-pills">
          <button class="pill all-pill active" data-group="city" data-value="all">All</button>
          <button class="pill" data-group="city" data-city="Yerevan"      data-value="Yerevan">Yerevan</button>
          <button class="pill" data-group="city" data-city="Gyumri"       data-value="Gyumri">Gyumri</button>
          <button class="pill" data-group="city" data-city="Vanadzor"     data-value="Vanadzor">Vanadzor</button>
          <button class="pill" data-group="city" data-city="Meghri"       data-value="Meghri">Meghri</button>
          <button class="pill" data-group="city" data-city="Kapan"        data-value="Kapan">Kapan</button>
          <button class="pill" data-group="city" data-city="Near Yerevan" data-value="Near Yerevan">Near Yerevan</button>
          <button class="pill" data-group="city" data-city="Other"        data-value="Other">Other</button>
        </div>
      </div>
    </div>
    <button class="filter-clear" onclick="clearFilters()">Clear filters</button>
  </div>

  <div class="sync-bar" id="syncBar">
    <div class="sync-left">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncStatus">Connecting…</span>
    </div>
    <div class="sync-right">
      <span class="sync-countdown" id="syncCountdown"></span>
      <button class="sync-refresh-btn" id="syncRefreshBtn" onclick="manualRefresh()">↻ Refresh now</button>
    </div>
  </div>

  <div class="view-bar">
    <div class="view-tabs">
      <button class="view-tab active" id="tabCalendar" onclick="switchView('calendar')">📅 Calendar</button>
      <button class="view-tab" id="tabList" onclick="switchView('list')">☰ List</button>
    </div>
    <div id="resultCount"></div>
  </div>

  <div id="calendarView">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="prevMonth()">←</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="cal-nav-btn" onclick="nextMonth()">→</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-weekday">Sun</div><div class="cal-weekday">Mon</div>
      <div class="cal-weekday">Tue</div><div class="cal-weekday">Wed</div>
      <div class="cal-weekday">Thu</div><div class="cal-weekday">Fri</div>
      <div class="cal-weekday">Sat</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div id="listView" style="display:none;">
    <div id="listSection"></div>
  </div>

</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Event Details</span>
      <button class="modal-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<script>
// ── SPREADSHEET CONFIG ──────────────────────────────────────────────────────
// Points to the Google Apps Script web app that reads the spreadsheet.
// To connect your new sheet:
//   1. Open your Google Sheet → Extensions → Apps Script
//   2. Paste the Apps Script code (see instructions below)
//   3. Deploy → New deployment → Web app → Execute as: Me → Anyone → Deploy
//   4. Replace the URL below with your new deployment URL
const API_URL = 'https://script.google.com/macros/s/AKfycbxnkiM0ZLk0HtLH-R51fu41YDUnyOeB0mchMPPYFFPUvu4x-_oBSutvZK-uqhSe3_I-aQ/exec';

// ── AUTO-REFRESH CONFIG ──────────────────────────────────────────────────────
const REFRESH_INTERVAL_SECONDS = 60; // refresh every 60 seconds

let refreshTimer = null;
let countdownTimer = null;
let secondsUntilRefresh = REFRESH_INTERVAL_SECONDS;
let lastFetchedAt = null;

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let allEvents = [], filteredEvents = [];
let activeFilters = { type: 'all', city: 'all' };
let calYear, calMonth;
let currentEvent = null; // stores the currently open event safely

const TYPE_STYLE = {
  festival:    { color: '#c0392b', bg: 'rgba(192,57,43,0.12)'  },
  concert:     { color: '#7c5cbf', bg: 'rgba(124,92,191,0.12)' },
  educational: { color: '#1a7a4a', bg: 'rgba(26,122,74,0.12)'  },
  nightlife:   { color: '#b5006e', bg: 'rgba(181,0,110,0.12)'  },
  sports:      { color: '#0070a8', bg: 'rgba(0,112,168,0.12)'  },
  art:         { color: '#9a6800', bg: 'rgba(154,104,0,0.12)'  },
  expo:        { color: '#6b3fa0', bg: 'rgba(107,63,160,0.12)' },
};
const PRICE_STYLE = {
  'free':                  { color: '#1a7a4a', bg: 'rgba(26,122,74,0.12)'   },
  'n/a':                   { color: '#888',    bg: 'rgba(136,136,136,0.12)' },
  'check website':         { color: '#0070a8', bg: 'rgba(0,112,168,0.12)'  },
  'registration required': { color: '#9a6800', bg: 'rgba(154,104,0,0.12)'  },
};
const CITY_STYLE = {
  'Yerevan':      { color: '#c0392b', bg: 'rgba(192,57,43,0.12)'  },
  'Gyumri':       { color: '#7c5cbf', bg: 'rgba(124,92,191,0.12)' },
  'Vanadzor':     { color: '#1a7a4a', bg: 'rgba(26,122,74,0.12)'  },
  'Meghri':       { color: '#9a6800', bg: 'rgba(154,104,0,0.12)'  },
  'Kapan':        { color: '#b5006e', bg: 'rgba(181,0,110,0.12)'  },
  'Near Yerevan': { color: '#0070a8', bg: 'rgba(0,112,168,0.12)'  },
  'Other':        { color: '#888',    bg: 'rgba(136,136,136,0.12)' },
};

function tagHTML(value, styleMap) {
  if (!value) return '';
  const key = String(value).toLowerCase();
  const s = styleMap[key] || styleMap[value] || { color:'#888', bg:'rgba(136,136,136,0.12)' };
  const display = String(value).charAt(0).toUpperCase() + String(value).slice(1);
  return `<span class="tag" style="color:${s.color};background:${s.bg};">${display}</span>`;
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseSheetDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = new Date(new Date(s).getTime() + 12 * 60 * 60 * 1000);
    return toDateStr(d);
  }
  const cleaned = s.replace(/[–—]\d+/, '');
  const d = new Date(cleaned);
  if (!isNaN(d)) return toDateStr(d);
  return '';
}

function parseSheetTime(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (!s) return '';
  if (s.startsWith('1899-12-30T')) {
    const d = new Date(s);
    let h = d.getUTCHours(), m = d.getUTCMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  return s;
}

function normaliseEvent(raw) {
  const dateStr = parseSheetDate(raw['Date']);
  const rawDateVal = String(raw['Date'] || '');
  let rawDate = rawDateVal;
  if (/^\d{4}-\d{2}-\d{2}T/.test(rawDateVal) && dateStr) {
    const [y,m,d] = dateStr.split('-');
    rawDate = `${MONTHS_LONG[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
  }
  return {
    name:        raw['name']        || '',
    date:        dateStr,
    rawDate:     rawDate,
    time:        parseSheetTime(raw['Time']),
    city:        raw['City']        || '',
    location:    raw['Place']       || '',
    type:        (raw['Type']       || '').toLowerCase(),
    price:       (raw['Price']      || '').toLowerCase(),
    link:        raw['Link']        || '',
    description: raw['Description'] || '',
  };
}

async function fetchEvents(isRefresh = false) {
  if (!isRefresh) showLoading();
  setSyncStatus('loading');
  try {
    const res = await fetch(API_URL + '?t=' + Date.now()); // cache-bust
    const raw = await res.json();
    allEvents = raw.map(normaliseEvent).filter(ev => ev.name && ev.date);
    lastFetchedAt = new Date();
    setSyncStatus('live');
  } catch(e) {
    console.error('FETCH ERROR:', e);
    allEvents = [];
    setSyncStatus('error');
    if (!isRefresh) {
      document.getElementById('calGrid').innerHTML =
        `<div style="grid-column:1/-1"><div class="state-box"><span class="icon">⚠️</span><h3>Could not load events</h3><p>Please try refreshing.</p></div></div>`;
    }
  }
  const now = new Date();
  if (!isRefresh) {
    calYear = now.getFullYear();
    calMonth = now.getMonth();
  }
  applyFilters();
  scheduleNextRefresh();
}

function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  const status = document.getElementById('syncStatus');
  dot.className = 'sync-dot';
  if (state === 'live') {
    dot.classList.add('live');
    const t = lastFetchedAt;
    const timeStr = t ? t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    status.textContent = `Live · updated ${timeStr}`;
  } else if (state === 'error') {
    dot.classList.add('error');
    status.textContent = 'Sync error — retrying…';
  } else {
    status.textContent = 'Syncing…';
  }
}

function scheduleNextRefresh() {
  clearTimeout(refreshTimer);
  clearInterval(countdownTimer);
  secondsUntilRefresh = REFRESH_INTERVAL_SECONDS;
  updateCountdown();
  countdownTimer = setInterval(() => {
    secondsUntilRefresh--;
    updateCountdown();
  }, 1000);
  refreshTimer = setTimeout(() => {
    clearInterval(countdownTimer);
    fetchEvents(true);
  }, REFRESH_INTERVAL_SECONDS * 1000);
}

function updateCountdown() {
  const el = document.getElementById('syncCountdown');
  if (secondsUntilRefresh > 0) {
    el.textContent = `next sync in ${secondsUntilRefresh}s`;
  } else {
    el.textContent = 'syncing…';
  }
}

function manualRefresh() {
  const btn = document.getElementById('syncRefreshBtn');
  btn.disabled = true;
  clearTimeout(refreshTimer);
  clearInterval(countdownTimer);
  document.getElementById('syncCountdown').textContent = 'syncing…';
  fetchEvents(true).finally(() => {
    btn.disabled = false;
  });
}

function showLoading() {
  document.getElementById('calGrid').innerHTML =
    `<div style="grid-column:1/-1"><div class="state-box"><div class="spinner"></div><p>Loading events…</p></div></div>`;
  document.getElementById('listSection').innerHTML =
    `<div class="state-box"><div class="spinner"></div><p>Loading events…</p></div>`;
}

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const group = pill.dataset.group;
    const value = pill.dataset.value;
    activeFilters[group] = value;
    document.querySelectorAll(`.pill[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    applyFilters();
  });
});

function clearFilters() {
  activeFilters = { type: 'all', city: 'all' };
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.pill.all-pill').forEach(p => p.classList.add('active'));
  applyFilters();
}

function applyFilters() {
  filteredEvents = allEvents.filter(ev => {
    const typeOk = activeFilters.type === 'all' || ev.type === activeFilters.type;
    const cityOk = activeFilters.city === 'all' || ev.city === activeFilters.city;
    return typeOk && cityOk;
  });
  const n = filteredEvents.length;
  document.getElementById('resultCount').textContent = `${n} event${n !== 1 ? 's' : ''} found`;
  renderCalendar();
  renderList();
}

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = `${MONTHS_LONG[calMonth]} ${calYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDay    = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays    = new Date(calYear, calMonth, 0).getDate();
  const today       = new Date();
  const totalCells  = Math.ceil((firstDay + daysInMonth) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    let date, isOther = false;
    if (i < firstDay) {
      date = new Date(calYear, calMonth - 1, prevDays - firstDay + i + 1); isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      date = new Date(calYear, calMonth + 1, i - firstDay - daysInMonth + 1); isOther = true;
    } else {
      date = new Date(calYear, calMonth, i - firstDay + 1);
    }
    const dateStr = toDateStr(date);
    const isToday = date.toDateString() === today.toDateString();
    const dayEvs  = filteredEvents.filter(e => e.date === dateStr);

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isOther ? ' other-month' : '') + (isToday ? ' today' : '');
    const numEl = document.createElement('span');
    numEl.className = 'day-num';
    numEl.textContent = date.getDate();
    cell.appendChild(numEl);

    dayEvs.slice(0,3).forEach(ev => {
      const chip = document.createElement('span');
      chip.className = 'cal-event-chip';
      const s = TYPE_STYLE[ev.type] || { color:'#888', bg:'rgba(136,136,136,0.15)' };
      chip.style.cssText = `color:${s.color};background:${s.bg};`;
      chip.textContent = ev.name;
      chip.onclick = () => openDetail(ev);
      cell.appendChild(chip);
    });

    if (dayEvs.length > 3) {
      const more = document.createElement('div');
      more.className = 'cal-more';
      more.textContent = `+${dayEvs.length - 3} more`;
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }
}

function prevMonth() { calMonth--; if (calMonth < 0)  { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0;  calYear++; } renderCalendar(); }

function renderList() {
  const section = document.getElementById('listSection');
  if (!filteredEvents.length) {
    section.innerHTML = `<div class="state-box"><span class="icon">🔍</span><h3>No events found</h3><p>Try adjusting your filters.</p></div>`;
    return;
  }
  const sorted = [...filteredEvents].sort((a,b) => a.date.localeCompare(b.date));
  const byMonth = {};
  sorted.forEach(ev => {
    const [y,m] = ev.date.split('-');
    const key = `${y}-${m}`;
    if (!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(ev);
  });
  section.innerHTML = '';
  Object.entries(byMonth).forEach(([key, evs]) => {
    const [y,m] = key.split('-');
    const group = document.createElement('div');
    group.className = 'list-month-group';
    group.innerHTML = `<div class="list-month-heading">${MONTHS_LONG[parseInt(m)-1]} ${y}</div>`;
    evs.forEach((ev, idx) => {
      const d = parseInt(ev.date.split('-')[2]);
      const card = document.createElement('div');
      card.className = 'event-card';
      card.style.animationDelay = `${idx * 40}ms`;
      card.innerHTML = `
        <div class="event-date-block">
          <div class="event-date-day">${d}</div>
          <div class="event-date-month">${MONTHS_SHORT[parseInt(m)-1]}</div>
        </div>
        <div class="event-info">
          <div class="event-name">${esc(ev.name)}</div>
          <div class="event-meta">
            ${ev.time ? `<span>🕐 ${esc(ev.time)}</span>` : ''}
            ${ev.location ? `<span>📍 ${esc(ev.location)}</span>` : ''}
          </div>
          <div class="event-tags">
            ${tagHTML(ev.type,  TYPE_STYLE)}
            ${tagHTML(ev.price, PRICE_STYLE)}
            ${tagHTML(ev.city,  CITY_STYLE)}
          </div>
        </div>
        <div class="event-action">
          <button class="gcal-btn">+ GCal</button>
        </div>
      `;
      card.querySelector('.gcal-btn').addEventListener('click', e => { e.stopPropagation(); addToGCal(ev); });
      card.addEventListener('click', () => openDetail(ev));
      group.appendChild(card);
    });
    section.appendChild(group);
  });
}

function switchView(v) {
  document.getElementById('calendarView').style.display = v === 'calendar' ? 'block' : 'none';
  document.getElementById('listView').style.display     = v === 'list'     ? 'block' : 'none';
  document.getElementById('tabCalendar').classList.toggle('active', v === 'calendar');
  document.getElementById('tabList').classList.toggle('active', v === 'list');
}

function openDetail(ev) {
  currentEvent = ev;
  const [y,m,d] = ev.date.split('-');
  const displayDate = ev.rawDate || `${MONTHS_LONG[parseInt(m)-1]} ${parseInt(d)}, ${y}`;

  const mapHTML = ev.location
    ? `<div class="detail-map">
        <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=${encodeURIComponent(ev.location + (ev.city ? ', ' + ev.city : '') + ', Armenia')}&output=embed"
          allowfullscreen></iframe>
      </div>`
    : '';

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-event-name">${esc(ev.name)}</div>
    <div class="detail-tags">
      ${tagHTML(ev.type,  TYPE_STYLE)}
      ${tagHTML(ev.price, PRICE_STYLE)}
      ${tagHTML(ev.city,  CITY_STYLE)}
    </div>
    <div class="detail-meta">
      <div class="detail-meta-row"><span class="detail-meta-icon">📅</span> ${esc(displayDate)}</div>
      ${ev.time     ? `<div class="detail-meta-row"><span class="detail-meta-icon">🕐</span> ${esc(ev.time)}</div>` : ''}
      ${ev.location ? `<div class="detail-meta-row"><span class="detail-meta-icon">📍</span> ${esc(ev.location)}</div>` : ''}
    </div>
    ${ev.description ? `<div class="detail-desc">${esc(ev.description)}</div>` : ''}
    ${mapHTML}
    <div class="detail-actions">
      <button class="btn-gcal-big" id="gcalBtn">📆 Add to Google Calendar</button>
      ${ev.link ? `<a href="${esc(ev.link)}" target="_blank" rel="noopener" class="btn-gcal-big btn-more" style="text-decoration:none;">🔗 More Info</a>` : ''}
    </div>
  `;

  document.getElementById('gcalBtn').addEventListener('click', () => addToGCal(currentEvent));
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  currentEvent = null;
}

function addToGCal(ev) {
  if (!ev) return;
  const dateCompact = ev.date.replace(/-/g, '');

  let dates = `${dateCompact}/${dateCompact}`;
  if (ev.time) {
    const parts = ev.time.split(/[–—]/).map(s => s.trim());
    const toISO = (dateStr, timeStr) => {
      const d = new Date(`${dateStr} ${timeStr}`);
      if (isNaN(d)) return null;
      return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    };
    const start = toISO(ev.date, parts[0]);
    const end   = parts[1] ? toISO(ev.date, parts[1]) : start;
    if (start) dates = `${start}/${end || start}`;
  }

  const details = [
    ev.time        ? `🕐 ${ev.time}`           : '',
    ev.description ? ev.description             : '',
    ev.link        ? `🔗 More info: ${ev.link}` : '',
  ].filter(Boolean).join('\n\n');

  const params = new URLSearchParams({
    action:   'TEMPLATE',
    text:     ev.name,
    dates,
    details,
    location: ev.location ? `${ev.location}${ev.city ? ', ' + ev.city : ''}, Armenia` : '',
  });
  window.open(`https://calendar.google.com/calendar/render?${params}`, '_blank');
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('detailOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeDetail(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

fetchEvents();
</script>
