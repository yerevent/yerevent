name: Sync events from Google Sheet

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # also allows running it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch events from Google
        run: node scripts/sync-events.js

      - name: Commit events.json if it changed
        run: |
          git add events.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git config user.name "yerevent sync robot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Update events.json from Google Sheet"
            git push
          fi
